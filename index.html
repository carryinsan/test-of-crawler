<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arix High-Throughput Batch Crawler</title>
  <style>
    :root {
      --bg: #090c10;
      --card: #131822;
      --border: #222c3d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --success: #3fb950;
      --danger: #f85149;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.5;
      padding: 32px 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 24px;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    p.sub {
      color: var(--muted);
      font-size: 14px;
      margin-top: 4px;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    textarea {
      width: 100%;
      height: 140px;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      padding: 12px;
      font-family: var(--mono);
      font-size: 13px;
      outline: none;
      resize: vertical;
    }
    textarea:focus { border-color: var(--accent); }
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      align-items: center;
    }
    button {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-run { background: var(--accent); color: #050a14; }
    .btn-preset { background: var(--border); color: var(--text); }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .stat-card small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .stat-card strong {
      display: block;
      font-size: 22px;
      margin-top: 4px;
    }
    .stat-card.passed strong { color: var(--success); }
    .stat-card.failed strong { color: var(--danger); }
    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 900px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .results-grid { grid-template-columns: 1fr; }
    }
    .column h2 {
      font-size: 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .column-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      font-family: var(--mono);
    }
    .passed-badge { background: #132d1e; color: var(--success); }
    .failed-badge { background: #37191d; color: var(--danger); }
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 600px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .card-item {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
    }
    .card-item .url {
      font-family: var(--mono);
      font-size: 12px;
      word-break: break-all;
      color: #9ecbff;
      text-decoration: none;
    }
    .card-item .details {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .details b { color: var(--text); }
    .tag {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    .tag-err { background: #3c1618; color: #ff7b72; }
    .tag-ok { background: #122b1c; color: #7ee787; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Arix Parallel Engine (Stress-Tester)</h1>
      <p class="sub">Direct endpoint: <code>https://arix-web-crawler-chi.vercel.app/api/crawler</code></p>
    </header>

    <section class="panel">
      <label for="urls">Target URLs (1 Per Line, Max 50)</label>
      <textarea id="urls" placeholder="https://example.com&#10;https://rust-lang.org&#10;https://news.ycombinator.com"></textarea>
      <div class="actions">
        <button id="btnRun" class="btn-run" onclick="runBatch()">Fire 50 in Parallel</button>
        <button class="btn-preset" onclick="loadPresets()">Load 10 Presets</button>
        <button class="btn-preset" onclick="clearAll()">Clear</button>
      </div>
    </section>

    <div class="stats">
      <div class="stat-card">
        <small>Processed</small>
        <strong id="statProcessed">0 / 0</strong>
      </div>
      <div class="stat-card passed">
        <small>Passed</small>
        <strong id="statPassed">0</strong>
      </div>
      <div class="stat-card failed">
        <small>Failed</small>
        <strong id="statFailed">0</strong>
      </div>
      <div class="stat-card">
        <small>Total Elapsed</small>
        <strong id="statTime">0 ms</strong>
      </div>
    </div>

    <div class="results-grid">
      <div class="column">
        <h2>
          <span>Passed Targets</span>
          <span id="badgePassed" class="column-badge passed-badge">0</span>
        </h2>
        <div id="listPassed" class="card-list"></div>
      </div>

      <div class="column">
        <h2>
          <span>Failed Targets</span>
          <span id="badgeFailed" class="column-badge failed-badge">0</span>
        </h2>
        <div id="listFailed" class="card-list"></div>
      </div>
    </div>
  </div>

  <script>
    const API_ENDPOINT = 'https://arix-web-crawler-chi.vercel.app/api/crawler';

    function loadPresets() {
      const presets = [
        'https://example.com',
        'https://news.ycombinator.com',
        'https://doc.rust-lang.org/book/',
        'https://httpbin.org/html',
        'https://www.wikipedia.org',
        'https://www.reuters.com',
        'https://www.theverge.com',
        'https://httpbin.org/status/404',
        'https://httpbin.org/status/401',
        'https://httpbin.org/redirect/6'
      ];
      document.getElementById('urls').value = presets.join('\n');
    }

    function clearAll() {
      document.getElementById('urls').value = '';
      document.getElementById('listPassed').innerHTML = '';
      document.getElementById('listFailed').innerHTML = '';
      document.getElementById('statProcessed').textContent = '0 / 0';
      document.getElementById('statPassed').textContent = '0';
      document.getElementById('statFailed').textContent = '0';
      document.getElementById('statTime').textContent = '0 ms';
      document.getElementById('badgePassed').textContent = '0';
      document.getElementById('badgeFailed').textContent = '0';
    }

    async function crawlTarget(rawUrl) {
      let url = rawUrl.trim();
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

      const start = performance.now();
      try {
        const res = await fetch(API_ENDPOINT, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ url: url })
        });
        const duration = Math.round(performance.now() - start);
        const data = await res.json();
        return { ok: data.ok && res.ok, url, duration, data };
      } catch (err) {
        return {
          ok: false,
          url,
          duration: Math.round(performance.now() - start),
          data: { error: { message: err.message || 'Network/CORS Error' } }
        };
      }
    }

    async function runBatch() {
      const text = document.getElementById('urls').value.trim();
      if (!text) return;

      const rawUrls = text.split('\n')
        .map(u => u.trim())
        .filter(u => u.length > 0)
        .slice(0, 50); // Enforce 50 max

      const btn = document.getElementById('btnRun');
      btn.disabled = true;
      btn.textContent = 'Executing...';

      document.getElementById('listPassed').innerHTML = '';
      document.getElementById('listFailed').innerHTML = '';

      let completed = 0;
      let passedCount = 0;
      let failedCount = 0;

      const statProcessed = document.getElementById('statProcessed');
      const statPassed = document.getElementById('statPassed');
      const statFailed = document.getElementById('statFailed');
      const statTime = document.getElementById('statTime');
      const badgePassed = document.getElementById('badgePassed');
      const badgeFailed = document.getElementById('badgeFailed');
      const listPassed = document.getElementById('listPassed');
      const listFailed = document.getElementById('listFailed');

      statProcessed.textContent = `0 / ${rawUrls.length}`;
      statPassed.textContent = '0';
      statFailed.textContent = '0';

      const startTime = performance.now();
      const interval = setInterval(() => {
        statTime.textContent = Math.round(performance.now() - startTime) + ' ms';
      }, 50);

      // Fire all up to 50 requests in parallel
      const promises = rawUrls.map(url =>
        crawlTarget(url).then(res => {
          completed++;
          statProcessed.textContent = `${completed} / ${rawUrls.length}`;

          if (res.ok) {
            passedCount++;
            statPassed.textContent = passedCount;
            badgePassed.textContent = passedCount;

            const card = document.createElement('div');
            card.className = 'card-item';
            card.innerHTML = `
              <a class="url" href="${res.url}" target="_blank" rel="noreferrer">${res.url}</a>
              <div class="details">
                <span class="tag tag-ok">PASSED</span>
                <span>Latency: <b>${res.duration}ms</b></span>
                <span>Quality: <b>${res.data.quality || 0}/100</b></span>
                <span>Words: <b>${(res.data.word_count || 0).toLocaleString()}</b></span>
              </div>
            `;
            listPassed.appendChild(card);
          } else {
            failedCount++;
            statFailed.textContent = failedCount;
            badgeFailed.textContent = failedCount;

            const errCode = (res.data && res.data.error && res.data.error.message) || 'UNKNOWN_ERROR';
            const card = document.createElement('div');
            card.className = 'card-item';
            card.innerHTML = `
              <a class="url" href="${res.url}" target="_blank" rel="noreferrer">${res.url}</a>
              <div class="details">
                <span class="tag tag-err">${errCode}</span>
                <span>Latency: <b>${res.duration}ms</b></span>
              </div>
            `;
            listFailed.appendChild(card);
          }
        })
      );

      await Promise.allSettled(promises);
      clearInterval(interval);
      statTime.textContent = Math.round(performance.now() - startTime) + ' ms';
      btn.disabled = false;
      btn.textContent = 'Fire 50 in Parallel';
    }
  </script>
</body>
</html>
